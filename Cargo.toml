[package]
name = "collegiate"
version = "1.0.0"
edition = "2021"
authors = ["Collegiate Systems Engineering Team <engineering@collegiate.edu>"]
description = "High-performance Rust database engine and collegiate social graph backend"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.4", features = ["util", "timeout", "cors"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
jsonwebtoken = "9.3"
dashmap = "5.5"
petgraph = { version = "0.6", features = ["serde-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
regex = "1.10"
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
